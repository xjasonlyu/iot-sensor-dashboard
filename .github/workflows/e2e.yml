name: Playwright E2E

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            packages/api-contract/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix packages/api-contract
          npm ci --prefix frontend

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run e2e
        env:
          VITE_AUTH0_AUDIENCE: https://e2e.invalid/api
          VITE_AUTH0_CLIENT_ID: e2e-client
          VITE_AUTH0_DOMAIN: e2e.invalid

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
